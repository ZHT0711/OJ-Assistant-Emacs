name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install Emacs and C++ compiler
        run: sudo apt-get update && sudo apt-get install -y emacs-nox g++
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:elisp
      - run: npm test
